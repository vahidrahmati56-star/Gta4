<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>همه چیز بلد</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:Tahoma,sans-serif;background:#000;color:#fff;touch-action:none}
canvas{display:block;touch-action:none}
#menu{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%, #2a0a45 0%, #0d0018 60%, #000 100%);padding:20px}
.title{font-size:clamp(38px,12vw,74px);font-weight:900;
  background:linear-gradient(90deg,#e8c87a,#d88a3d,#e8c87a);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;text-align:center}
@keyframes shine{to{background-position:200% 0}}
.subtitle{margin-top:8px;font-size:clamp(13px,3.6vw,19px);color:#b898d8;letter-spacing:4px;text-align:center}
.btns{margin-top:36px;display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.btn{width:100%;max-width:340px;padding:16px 24px;font-size:clamp(15px,4.2vw,18px);font-weight:700;cursor:pointer;font-family:inherit;
  border:2px solid rgba(220,180,100,.55);border-radius:14px;color:#f0dcb0;
  background:linear-gradient(180deg,rgba(70,25,110,.75),rgba(30,8,55,.9));transition:.2s}
.btn:active{transform:scale(.96);border-color:#e8c87a}
.foot{margin-top:30px;font-size:11px;color:#8878a0;letter-spacing:2px}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#clock{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;background:rgba(8,5,20,.85);border:1.5px solid rgba(220,180,100,.5);
  border-radius:12px;padding:6px 12px;text-align:center;min-width:110px}
#clock .day{font-size:12px;color:#e8c87a;font-weight:700}
#clock .time{font-size:20px;font-weight:900;margin-top:1px}
#clock .badge{margin-top:3px;font-size:9px;color:#f09a5a;background:rgba(240,120,40,.15);
  border:1px solid rgba(240,120,40,.5);border-radius:6px;padding:1px 5px;display:none}
#money{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;background:rgba(8,5,20,.85);border:1.5px solid rgba(120,220,140,.5);
  border-radius:12px;padding:8px 14px;font-size:16px;font-weight:800;color:#9cd8a8}
#energy{position:absolute;top:calc(58px + env(safe-area-inset-top));left:8px;background:rgba(8,5,20,.85);border:1.5px solid rgba(220,180,100,.4);
  border-radius:12px;padding:6px 12px;font-size:13px}
#energy .bar{width:110px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:3px;overflow:hidden}
#energy .fill{height:100%;background:linear-gradient(90deg,#f0a030,#f0e030);width:100%;transition:width .3s}
#inv{position:absolute;bottom:calc(200px + env(safe-area-inset-bottom));left:8px;background:rgba(8,5,20,.85);
  border:1.5px solid rgba(220,180,100,.35);border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.6;max-width:50vw}
#prompt{position:absolute;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:rgba(8,5,20,.9);border:2px solid #e8c87a;border-radius:12px;padding:8px 16px;font-size:13px;font-weight:700;
  color:#f0dcb0;opacity:0;transition:.2s;white-space:nowrap;max-width:92vw;text-align:center}
#prompt.show{opacity:1}
#toast{position:absolute;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:rgba(8,5,20,.94);border:2px solid #d88a3d;border-radius:12px;padding:8px 16px;font-size:13px;font-weight:700;
  color:#e8c87a;opacity:0;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#dust{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;transition:.4s}
#dust.show{opacity:1}
#dust::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, transparent 20%, rgba(180,140,90,.42) 100%)}
.dustMsg{position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);background:rgba(110,35,8,.94);
  border:3px solid #e0a040;border-radius:14px;padding:12px 22px;font-size:clamp(14px,4.5vw,20px);font-weight:900;
  animation:pulse 1s ease-in-out infinite;max-width:90vw;text-align:center}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.05)}}
#dialog{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.45);padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#dialogBox{background:linear-gradient(180deg,rgba(18,8,32,.98),rgba(6,2,14,.99));border:2px solid #d0a860;
  border-radius:16px;padding:16px 18px;width:100%;max-width:520px}
#dialogName{color:#e8c87a;font-weight:900;font-size:15px;margin-bottom:6px}
#dialogText{font-size:14px;line-height:1.8;margin-bottom:12px;white-space:pre-line}
#dialogButtons{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dbtn{padding:12px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:2px solid rgba(220,180,100,.6);
  border-radius:10px;color:#f0dcb0;background:linear-gradient(180deg,rgba(70,25,110,.8),rgba(30,8,55,.9));min-width:80px}
.dbtn:active{transform:scale(.95)}
#touchUI{position:fixed;inset:0;z-index:30;pointer-events:none;display:none}
#touchUI.on{display:block}
#joy{position:absolute;left:calc(20px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));
  width:130px;height:130px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.09), rgba(255,255,255,.02));
  border:2px solid rgba(255,255,255,.22);pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e8c87a, #b87830);border:2px solid rgba(255,255,255,.6);
  transform:translate(-50%,-50%);box-shadow:0 4px 18px rgba(200,120,40,.5)}
#actions{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:auto}
.abtn{width:72px;height:72px;border-radius:50%;border:2.5px solid rgba(255,255,255,.5);
  background:radial-gradient(circle at 35% 30%, rgba(90,45,140,.85), rgba(30,10,60,.9));
  color:#fff;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;
  font-family:inherit;touch-action:manipulation}
.abtn:active{transform:scale(.9);border-color:#e8c87a}
.abtn.small{width:58px;height:58px;font-size:20px}
.abtn.run{background:radial-gradient(circle at 35% 30%, rgba(220,120,50,.85), rgba(140,50,10,.9))}
.abtn.run.active{border-color:#fff}
#lookZone{position:absolute;top:0;right:0;width:55%;height:70%;pointer-events:auto;touch-action:none}
#lookHint{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:rgba(255,255,255,.3);
  font-size:11px;writing-mode:vertical-rl;pointer-events:none}
#rotateWarn{position:fixed;inset:0;z-index:200;background:#0d0018;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:30px}
#rotateWarn p{font-size:16px;color:#e8c87a;font-weight:700}
@media (orientation:portrait) and (max-width:900px){#rotateWarn.show{display:flex}}
#tvScreen{position:fixed;inset:0;z-index:35;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column}
#tvScreen.on{display:flex}
#tvScreen .txt{color:#e8c87a;font-size:clamp(16px,5vw,24px);font-weight:900;text-align:center;padding:20px;white-space:pre-line}
#tvScreen .close{position:absolute;top:16px;right:16px;padding:10px 18px;border:2px solid #e8c87a;border-radius:10px;
  background:rgba(0,0,0,.7);color:#f0dcb0;font-weight:700;font-family:inherit;font-size:14px;cursor:pointer}
#miniGame{position:fixed;inset:0;z-index:36;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px}
#miniGame.on{display:flex}
#miniGame .box{background:linear-gradient(180deg,rgba(30,10,50,.98),rgba(10,2,20,.99));border:2px solid #e8c87a;
  border-radius:18px;padding:22px;text-align:center;max-width:400px;width:100%}
#miniGame h3{color:#e8c87a;font-size:18px;margin-bottom:10px}
#miniGame p{font-size:13px;margin-bottom:14px;line-height:1.7;color:#d8c8b0}
#miniGame .track{width:100%;height:22px;background:#1a0a2a;border-radius:11px;position:relative;margin-bottom:16px;border:1px solid #4a2a6a}
#miniGame .target{position:absolute;top:0;height:100%;background:rgba(120,220,140,.35);border-left:1px solid #7ddc8c;border-right:1px solid #7ddc8c}
#miniGame .cursor{position:absolute;top:-2px;width:4px;height:26px;background:#e8c87a;border-radius:2px;box-shadow:0 0 8px #e8c87a}
#miniGame .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#hookahPanel{position:fixed;inset:0;z-index:36;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
#hookahPanel.on{display:flex}
#hookahPanel .box{background:linear-gradient(180deg,rgba(30,10,50,.98),rgba(10,2,20,.99));border:2px solid #e8c87a;
  border-radius:18px;padding:24px;text-align:center;max-width:340px}
#hookahPanel h3{color:#e8c87a;font-size:20px;margin-bottom:14px}
#hookahPanel p{font-size:13px;margin-bottom:16px;line-height:1.8;color:#d8c8b0}
#hookahPanel .btnrow{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>

<div id="menu">
  <div class="title">همه چیز بلد</div>
  <div class="subtitle">دهکده انارستان</div>
  <div class="btns">
    <button class="btn" id="btnStart">▶ شروع بازی</button>
    <button class="btn" id="btnHelp">📖 راهنما</button>
    <button class="btn" id="btnAbout">ℹ درباره</button>
  </div>
  <div class="foot">🏘️ ۱۲ شغل • واقع‌گرایانه</div>
</div>

<canvas id="c"></canvas>

<div id="hud">
  <div id="clock">
    <div class="day" id="dayLabel">شنبه</div>
    <div class="time" id="timeLabel">06:00</div>
    <div class="badge" id="dayBadge">🐐 چوپانی</div>
  </div>
  <div id="money">💰 ۲۰۰</div>
  <div id="energy">⚡ انرژی<div class="bar"><div class="fill" id="energyFill"></div></div></div>
  <div id="inv"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
</div>

<div id="dust"><div class="dustMsg">⚠️ برای چشمات خاک ضرر داره</div></div>

<div id="tvScreen">
  <div class="txt" id="tvTxt">📺 اخبار دهکده</div>
  <button class="close" onclick="document.getElementById('tvScreen').classList.remove('on')">✕</button>
</div>

<div id="miniGame">
  <div class="box">
    <h3 id="mgTitle">مینی‌گیم</h3>
    <p id="mgDesc"></p>
    <div class="track">
      <div class="target" id="mgTarget"></div>
      <div class="cursor" id="mgCursor"></div>
    </div>
    <div class="btnrow">
      <button class="dbtn" id="mgHit">🎯 بزن!</button>
      <button class="dbtn" id="mgCancel">لغو</button>
    </div>
  </div>
</div>

<div id="hookahPanel">
  <div class="box">
    <h3>💨 قلیون</h3>
    <p>هزینه: ۵۰ سکه<br>انرژی: +۳۰</p>
    <div class="btnrow">
      <button class="dbtn" id="hookahYes">بکش (۵۰)</button>
      <button class="dbtn" id="hookahNo">بی‌خیال</button>
    </div>
  </div>
</div>

<div id="touchUI">
  <div id="lookZone"><div id="lookHint">👆 بکش</div></div>
  <div id="joy"><div id="joyKnob"></div></div>
  <div id="actions">
    <button class="abtn small" id="btnRun">🏃</button>
    <button class="abtn" id="btnInteract">E</button>
  </div>
</div>

<div id="dialog" class="hidden">
  <div id="dialogBox">
    <div id="dialogName"></div>
    <div id="dialogText"></div>
    <div id="dialogButtons"></div>
  </div>
</div>

<div id="rotateWarn">
  <p>📱 گوشی رو بچرخون افقی</p>
  <button class="btn" style="max-width:200px" onclick="document.getElementById('rotateWarn').classList.remove('show')">ادامه</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';

// ==========================================================================
// تنظیمات و وضعیت
// ==========================================================================
var IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
var DAYS = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
var SHEPHERD_DAYS = [0, 3, 5];
var SEC_PER_GAME_MIN = 0.14;

var state = {
  day:0, hour:6, minute:0, money:200, energy:100,
  started:false, paused:true,
  hasBasket:false, basketFruit:0,
  sheepFollowing:false, sheepInPasture:false, waitingForNight:false,
  dialogueOpen:false, insideHome:false,
  tool:null, job:null, carrying:null, sitting:false, miniGameActive:false
};

var player = {
  group:null, pos:null, rot:Math.PI, pitch:0.15,
  speed:6, running:false, walkPhase:0,
  arms:{l:null,r:null}, legs:{l:null,r:null}, head:null,
  covering:false, coverT:0, dustT:0, toolMesh:null
};

// ==========================================================================
// سه‌بعدی
// ==========================================================================
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc4d8);
scene.fog = new THREE.FogExp2(0xb0c8d8, 0.0075);

var camera = new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, 0.1, 900);

var canvasEl = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({canvas: canvasEl, antialias: !IS_TOUCH});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_TOUCH ? 1.4 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  checkOrientation();
});
window.addEventListener('orientationchange', function(){ setTimeout(checkOrientation, 200); });

function checkOrientation(){
  var w = document.getElementById('rotateWarn');
  if(window.innerHeight > window.innerWidth && window.innerWidth < 900 && IS_TOUCH) w.classList.add('show');
  else w.classList.remove('show');
}

// نور
var hemi = new THREE.HemisphereLight(0xbfd8f0, 0x5a7a4a, 0.55); scene.add(hemi);
var sun = new THREE.DirectionalLight(0xffe8c0, 1.35);
sun.position.set(60, 90, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(IS_TOUCH?1024:2048, IS_TOUCH?1024:2048);
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
sun.shadow.camera.far = 300;
scene.add(sun);
var ambNight = new THREE.AmbientLight(0x1a2a4a, 0.0); scene.add(ambNight);

// ==========================================================================
// تکسچرها
// ==========================================================================
function makeTex(w,h,fn,r){
  r = r || 1;
  var c = document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(r,r);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

var grassTex = makeTex(256,256,function(ctx,w,h){
  ctx.fillStyle = '#5a8a3e'; ctx.fillRect(0,0,w,h);
  for(var i=0;i<4000;i++){
    var g = 90+Math.random()*70;
    ctx.fillStyle = 'rgba('+(40+Math.random()*30|0)+','+(g|0)+','+(30+Math.random()*30|0)+','+(0.4+Math.random()*0.5)+')';
    ctx.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*2, 1+Math.random()*3);
  }
},25);

var dirtTex = makeTex(256,256,function(ctx,w,h){
  ctx.fillStyle = '#8a7355'; ctx.fillRect(0,0,w,h);
  for(var i=0;i<4000;i++){
    var g = 100+Math.random()*70;
    ctx.fillStyle = 'rgba('+(g|0)+','+(g*0.8|0)+','+(g*0.6|0)+','+(0.4+Math.random()*0.5)+')';
    ctx.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*3, 1+Math.random()*3);
  }
},8);

var adobeTex = makeTex(256,256,function(ctx,w,h){
  ctx.fillStyle = '#c9a878'; ctx.fillRect(0,0,w,h);
  for(var i=0;i<3000;i++){
    ctx.fillStyle = 'rgba('+(180+Math.random()*50|0)+','+(150+Math.random()*40|0)+','+(110+Math.random()*40|0)+','+(0.4+Math.random()*0.4)+')';
    ctx.fillRect(Math.random()*w, Math.random()*h, 2+Math.random()*4, 2+Math.random()*4);
  }
},2);

var woodTex = makeTex(256,256,function(ctx,w,h){
  ctx.fillStyle = '#8a6540'; ctx.fillRect(0,0,w,h);
  for(var i=0;i<30;i++){
    ctx.strokeStyle = 'rgba('+(60+Math.random()*40|0)+','+(40+Math.random()*30|0)+','+(20+Math.random()*20|0)+','+(0.3+Math.random()*0.4)+')';
    ctx.lineWidth = 1+Math.random()*3;
    var x = Math.random()*w;
    ctx.beginPath(); ctx.moveTo(x, 0);
    for(var y=0;y<h;y+=20) ctx.lineTo(x + Math.sin(y*0.05)*8 + (Math.random()-0.5)*3, y);
    ctx.stroke();
  }
},2);

var wallInteriorTex = makeTex(256,256,function(ctx,w,h){
  ctx.fillStyle = '#e8dcc0'; ctx.fillRect(0,0,w,h);
  for(var i=0;i<1500;i++){
    ctx.fillStyle = 'rgba('+(200+Math.random()*40|0)+','+(180+Math.random()*40|0)+','+(140+Math.random()*40|0)+','+(0.2+Math.random()*0.3)+')';
    ctx.fillRect(Math.random()*w, Math.random()*h, 2+Math.random()*3, 2+Math.random()*3);
  }
},1);

// ==========================================================================
// زمین و جاده
// ==========================================================================
var ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({map: grassTex, roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

function makeRoad(x,z,w,h){
  var t = dirtTex.clone(); t.needsUpdate = true; t.repeat.set(w/6, h/6);
  var m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshStandardMaterial({map:t, roughness:1}));
  m.rotation.x = -Math.PI/2; m.position.set(x, 0.02, z); m.receiveShadow = true;
  scene.add(m);
}
makeRoad(0, 0, 12, 120);
makeRoad(0, 0, 120, 12);

// ==========================================================================
// درخت انار و درخت معمولی
// ==========================================================================
function makeTree(x, z, scale){
  scale = scale || 1;
  var g = new THREE.Group();
  var trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.45, 3.2, 10),
    new THREE.MeshStandardMaterial({color:0x8a6a48, roughness:0.95})
  );
  trunk.position.y = 1.6; trunk.castShadow = true; g.add(trunk);
  var lc = [0x3a7a2a, 0x4a8a38, 0x2f6a24];
  for(var i=0;i<4;i++){
    var f = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.4 - i*0.12, 1),
      new THREE.MeshStandardMaterial({color: lc[i%3], roughness:1, flatShading:true})
    );
    var a = (i/4)*Math.PI*2;
    var r = i === 0 ? 0 : 0.9;
    f.position.set(Math.cos(a)*r, 4.2, Math.sin(a)*r);
    f.castShadow = true; g.add(f);
  }
  g.position.set(x, 0, z); g.scale.setScalar(scale);
  scene.add(g); return g;
}

var pomTrees = [];
function makePomTree(x, z){
  var g = new THREE.Group();
  var trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.20, 0.32, 2.4, 8),
    new THREE.MeshStandardMaterial({color:0x8a5a3a, roughness:0.95})
  );
  trunk.position.y = 1.2; trunk.castShadow = true; g.add(trunk);
  var lc = [0x3a8a30, 0x4a9a3a, 0x2f7a24];
  for(var i=0;i<4;i++){
    var f = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.2 - i*0.1, 1),
      new THREE.MeshStandardMaterial({color: lc[i%3], roughness:1, flatShading:true})
    );
    var a = (i/4)*Math.PI*2;
    var r = i === 0 ? 0 : 0.7;
    f.position.set(Math.cos(a)*r, 3.4, Math.sin(a)*r);
    f.castShadow = true; g.add(f);
  }
  var fruits = [];
  var fm = new THREE.MeshStandardMaterial({color:0xb02222, roughness:0.35, emissive:0x2a0000, emissiveIntensity:0.3});
  for(var j=0;j<20;j++){
    var fr = new THREE.Mesh(new THREE.SphereGeometry(0.17, 8, 8), fm);
    var a2 = Math.random()*Math.PI*2;
    var b2 = Math.random()*Math.PI;
    var r2 = 1.5;
    fr.position.set(Math.sin(b2)*Math.cos(a2)*r2, 3.4 + Math.cos(b2)*r2*0.8, Math.sin(b2)*Math.sin(a2)*r2);
    fr.castShadow = true; g.add(fr); fruits.push(fr);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  pomTrees.push({group:g, fruits:fruits, remaining:20});
}

function makeBuilding(x, z, w, h, d, tint, roofColor){
  var g = new THREE.Group();
  var wt = adobeTex.clone(); wt.needsUpdate = true;
  wt.repeat.set(Math.max(1, w/3), Math.max(1, h/3));
  var body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({map: wt, roughness:0.92, color: tint})
  );
  body.position.y = h/2; body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  var roof = new THREE.Mesh(
    new THREE.ConeGeometry(Math.max(w,d)*0.78, 1.8, 4),
    new THREE.MeshStandardMaterial({color: roofColor, roughness:0.85})
  );
  roof.position.y = h + 0.9; roof.rotation.y = Math.PI/4; roof.castShadow = true;
  g.add(roof);
  var doorMat = new THREE.MeshStandardMaterial({color:0x5a3a20, roughness:0.85});
  var door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.12), doorMat);
  door.position.set(0, 1.1, d/2 + 0.06); door.castShadow = true;
  g.add(door);
  g.position.set(x, 0, z);
  scene.add(g);
  return g;
}

function makeCharacter(opts){
  opts = opts || {};
  var shirt = opts.shirt !== undefined ? opts.shirt : 0x3a5fc8;
  var pants = opts.pants !== undefined ? opts.pants : 0x2a2a3a;
  var skin = opts.skin !== undefined ? opts.skin : 0xe8b088;
  var glasses = opts.glasses !== false;
  var hairColor = opts.hairColor !== undefined ? opts.hairColor : 0x1a1a1a;

  var c = new THREE.Group();
  var skinM = new THREE.MeshStandardMaterial({color:skin, roughness:0.72});
  var shirtM = new THREE.MeshStandardMaterial({color:shirt, roughness:0.88});
  var pantsM = new THREE.MeshStandardMaterial({color:pants, roughness:0.92});
  var darkM = new THREE.MeshStandardMaterial({color:0x0a0a0a, metalness:0.6, roughness:0.3});
  var lensM = new THREE.MeshPhysicalMaterial({color:0xaaddff, transparent:true, opacity:0.25, roughness:0.05});
  var whiteM = new THREE.MeshStandardMaterial({color:0xf8f8f8, roughness:0.4});
  var pupilM = new THREE.MeshStandardMaterial({color:0x0a0a10, roughness:0.2});
  var hairM = new THREE.MeshStandardMaterial({color:hairColor, roughness:0.85});

  var torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.55, 6, 12), shirtM);
  torso.position.y = 1.18; torso.castShadow = true;
  c.add(torso);

  var shoulders = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.14, 0.36), shirtM);
  shoulders.position.y = 1.50; shoulders.castShadow = true;
  c.add(shoulders);

  var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.12, 8), skinM);
  neck.position.y = 1.62;
  c.add(neck);

  var head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 20), skinM);
  head.position.y = 1.79; head.scale.set(1, 1.13, 1.02);
  head.castShadow = true;
  c.add(head);

  var hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.238, 16, 16, 0, Math.PI*2, 0, Math.PI*0.62),
    hairM
  );
  hair.position.y = 1.815; hair.scale.set(1.02, 1.15, 1.04); hair.castShadow = true;
  c.add(hair);

  [-1,1].forEach(function(s){
    var ear = new THREE.Mesh(new THREE.SphereGeometry(0.052, 8, 8), skinM);
    ear.position.set(s*0.215, 1.79, 0.01); ear.scale.set(0.7, 1, 0.8);
    c.add(ear);
  });

  [-0.078, 0.078].forEach(function(x){
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.036, 10, 10), whiteM);
    eye.position.set(x, 1.838, -0.192); eye.scale.set(1, 0.9, 0.7);
    c.add(eye);
    var iris = new THREE.Mesh(new THREE.SphereGeometry(0.020, 10, 10),
      new THREE.MeshStandardMaterial({color:0x4a3520, roughness:0.15}));
    iris.position.set(x, 1.838, -0.220); iris.scale.set(1, 1, 0.55);
    c.add(iris);
    var pupil = new THREE.Mesh(new THREE.SphereGeometry(0.010, 8, 8), pupilM);
    pupil.position.set(x, 1.838, -0.227); pupil.scale.set(1, 1, 0.5);
    c.add(pupil);
  });

  var nose = new THREE.Mesh(new THREE.ConeGeometry(0.036, 0.10, 6), skinM);
  nose.rotation.x = Math.PI/2; nose.position.set(0, 1.79, -0.215);
  c.add(nose);

  var mouth = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.012, 0.02),
    new THREE.MeshStandardMaterial({color:0xa04040, roughness:0.6}));
  mouth.position.set(0, 1.735, -0.218);
  c.add(mouth);

  if(glasses){
    var frameMat = new THREE.MeshStandardMaterial({color:0x0a0a0a, metalness:0.6, roughness:0.3});
    [-0.078, 0.078].forEach(function(x){
      var ring = new THREE.Mesh(new THREE.TorusGeometry(0.058, 0.008, 6, 16), frameMat);
      ring.position.set(x, 1.838, -0.198);
      c.add(ring);
      var lens = new THREE.Mesh(new THREE.CircleGeometry(0.056, 16), lensM);
      lens.position.set(x, 1.838, -0.200);
      c.add(lens);
    });
    var bridge = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.008, 0.008), frameMat);
    bridge.position.set(0, 1.838, -0.198);
    c.add(bridge);
  }

  function makeArm(side){
    var sh = new THREE.Group();
    sh.position.set(side*0.35, 1.45, 0);
    var ua = new THREE.Mesh(new THREE.CapsuleGeometry(0.072, 0.34, 4, 10), shirtM);
    ua.position.y = -0.24; ua.castShadow = true;
    sh.add(ua);
    var elbow = new THREE.Group(); elbow.position.y = -0.48;
    var fa = new THREE.Mesh(new THREE.CapsuleGeometry(0.062, 0.30, 4, 10), shirtM);
    fa.position.y = -0.20; fa.castShadow = true;
    elbow.add(fa);
    var hand = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 0.07), skinM);
    hand.position.y = -0.42; hand.castShadow = true;
    elbow.add(hand);
    sh.add(elbow);
    c.add(sh);
    return sh;
  }
  function makeLeg(side){
    var hip = new THREE.Group(); hip.position.set(side*0.13, 0.80, 0);
    var thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.10, 0.32, 4, 10), pantsM);
    thigh.position.y = -0.24; thigh.castShadow = true;
    hip.add(thigh);
    var knee = new THREE.Group(); knee.position.y = -0.46;
    var shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.32, 4, 10), pantsM);
    shin.position.y = -0.22; shin.castShadow = true;
    knee.add(shin);
    var shoeMat = new THREE.MeshStandardMaterial({color:0x181818, roughness:0.55});
    var shoe = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.09, 0.28), shoeMat);
    shoe.position.set(0, -0.46, -0.05);
    knee.add(shoe);
    hip.add(knee);
    c.add(hip);
    return hip;
  }

  c.userData = {
    arms:{l:makeArm(-1), r:makeArm(1)},
    legs:{l:makeLeg(-1), r:makeLeg(1)},
    head:head
  };
  return c;
}

function setPlayerTool(type){
  if(player.toolMesh){
    player.arms.r.remove(player.toolMesh);
    player.toolMesh = null;
  }
  if(!type) return;
  var g = new THREE.Group();
  var woodM = new THREE.MeshStandardMaterial({color:0x8a6540, roughness:0.85});
  var metalM = new THREE.MeshStandardMaterial({color:0x909098, metalness:0.85, roughness:0.3});

  if(type === 'scissors'){
    var b1 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.20, 0.02), metalM);
    b1.position.set(-0.02, 0, 0); b1.rotation.z = 0.15; g.add(b1);
    var b2 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.20, 0.02), metalM);
    b2.position.set(0.02, 0, 0); b2.rotation.z = -0.15; g.add(b2);
  } else if(type === 'torch'){
    var handle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.30, 8), woodM);
    handle.position.y = 0; g.add(handle);
    var nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.04, 0.10, 8), metalM);
    nozzle.position.y = 0.20; g.add(nozzle);
    var flame = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.15, 8),
      new THREE.MeshBasicMaterial({color:0x88ccff, transparent:true, opacity:0.85}));
    flame.position.y = 0.32; g.add(flame);
  } else if(type === 'saw'){
    var blade = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.35, 0.14), metalM);
    blade.position.y = 0.10; g.add(blade);
    var handle2 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.14, 0.08), woodM);
    handle2.position.y = -0.12; g.add(handle2);
  } else if(type === 'hammer'){
    var handle3 = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.35, 8), woodM);
    handle3.position.y = 0; g.add(handle3);
    var headH = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.10, 0.08), metalM);
    headH.position.y = 0.19; g.add(headH);
  } else if(type === 'rod'){
    var rod = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.6, 6), metalM);
    rod.rotation.x = Math.PI/3; g.add(rod);
  } else if(type === 'watering'){
    var bodyW = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.10, 0.20, 10), metalM);
    g.add(bodyW);
  } else if(type === 'package'){
    var boxP = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.22, 0.24),
      new THREE.MeshStandardMaterial({color:0x9a6a3a, roughness:0.9}));
    g.add(boxP);
  } else if(type === 'dough' || type === 'dough_ready'){
    var dough = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 10),
      new THREE.MeshStandardMaterial({color: type === 'dough_ready' ? 0xc89850 : 0xf0d8a0, roughness:0.9}));
    dough.scale.y = 0.6; g.add(dough);
  } else if(type === 'bread' || type === 'bread_baking'){
    var bread = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.14, 4, 10),
      new THREE.MeshStandardMaterial({color: type === 'bread_baking' ? 0xc88040 : 0xe0b070, roughness:0.85}));
    bread.rotation.z = Math.PI/2; g.add(bread);
  }

  g.position.set(0, -0.48, -0.08);
  player.arms.r.add(g);
  player.toolMesh = g;
}

function isShepherdDay(){ return SHEPHERD_DAYS.indexOf(state.day) !== -1; }

function updateHUD(){
  dayLabelEl.textContent = DAYS[state.day];
  timeLabelEl.textContent = String(state.hour).padStart(2,'0') + ':' + String(Math.floor(state.minute)).padStart(2,'0');
  moneyEl.textContent = '💰 ' + Math.round(state.money);
  energyFill.style.width = state.energy + '%';
  badgeEl.style.display = isShepherdDay() ? 'block' : 'none';
  var inv = '';
  if(state.hasBasket) inv += '🧺 ' + state.basketFruit + '/20<br>';
  if(state.tool) inv += '🔧 ' + state.tool + '<br>';
  if(state.carrying) inv += '📦 ' + state.carrying + '<br>';
  if(state.job) inv += '💼 ' + state.job.label + ' (' + state.job.step + '/' + state.job.max + ')<br>';
  if(state.insideHome) inv += '🏠 خانه<br>';
  invEl.innerHTML = inv || '🎒 خالی';
}

function showToast(msg, dur){
  dur = dur || 2400;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  if(toastEl._t) clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function(){ toastEl.classList.remove('show'); }, dur);
}

function onNewDay(){
  showToast('☀️ ' + DAYS[state.day]);
  state.sheepFollowing = false;
  state.sheepInPasture = false;
  state.waitingForNight = false;
  state.hasBasket = false;
  state.basketFruit = 0;
  state.job = null;
  state.carrying = null;
  state.tool = null;
  setPlayerTool(null);
  sheep.forEach(function(s){ s.group.position.set(s.home.x, 0, s.home.z); });
  pomTrees.forEach(function(t){ t.remaining = 20; });
  flowers.forEach(function(f){ f.watered = false; });
}

function advanceTime(m){
  state.minute += m;
  state.energy = Math.max(0, state.energy - m * 0.06);
  while(state.minute >= 60){ state.minute -= 60; state.hour++; }
  while(state.hour >= 24){
    state.hour -= 24;
    state.day = (state.day + 1) % 7;
    onNewDay();
  }
}

function showDialog(name, text, buttons){
  state.dialogueOpen = true;
  dialogEl.classList.remove('hidden');
  dialogName.textContent = name;
  dialogText.textContent = text;
  dialogButtons.innerHTML = '';
  var btns = buttons || [{label:'باشه', action: closeDialog}];
  btns.forEach(function(b){
    var el = document.createElement('button');
    el.className = 'dbtn';
    el.textContent = b.label;
    el.onclick = function(ev){
      ev.stopPropagation();
      closeDialog();
      if(b.action) b.action();
    };
    dialogButtons.appendChild(el);
  });
}

  state.dialogueOpen = false;
  dialogEl.classList.add('hidden');
}

var mg = {active:false, timer:0, targetPos:0.5, targetWidth:0.2, cursor:0, onWin:null, onLose:null, speed:1};
function startMiniGame(title, desc, onWin, onLose, speed){
  mg.active = true;
  mg.timer = 0;
  mg.targetPos = 0.3 + Math.random()*0.4;
  mg.targetWidth = 0.18 + Math.random()*0.1;
  mg.cursor = 0;
  mg.onWin = onWin;
  mg.onLose = onLose;
  mg.speed = speed || 1;
  document.getElementById('miniGame').classList.add('on');
  document.getElementById('mgTitle').textContent = title;
  document.getElementById('mgDesc').textContent = desc;
  var t = document.getElementById('mgTarget');
  t.style.left = (mg.targetPos*100) + '%';
  t.style.width = (mg.targetWidth*100) + '%';
  document.getElementById('mgCursor').style.left = '0%';
}
document.getElementById('mgHit').onclick = function(){
  if(!mg.active) return;
  var d = Math.abs(mg.cursor - mg.targetPos);
  if(d < mg.targetWidth / 2 + 0.04){
    mg.active = false;
    document.getElementById('miniGame').classList.remove('on');
    if(mg.onWin) mg.onWin();
  } else {
    mg.active = false;
    document.getElementById('miniGame').classList.remove('on');
    if(mg.onLose) mg.onLose();
  }
};
document.getElementById('mgCancel').onclick = function(){
  mg.active = false;
  document.getElementById('miniGame').classList.remove('on');
};

function sleepTo(h, m){
  if(h < state.hour || (h === state.hour && m <= state.minute)){
    state.day = (state.day + 1) % 7;
    onNewDay();
  }
  state.hour = h;
  state.minute = m;
  state.energy = 100;
  showToast('😴 بیدار — ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
  updateHUD();
}

// دود قلیون
function smokeBurst(){
  var N = 30;
  var geo = new THREE.BufferGeometry();
  var pos = new Float32Array(N*3);
  for(var i=0; i<N; i++){
    pos[i*3] = HOME_ORIGIN.x - 1.5 + (Math.random()-0.5)*0.3;
    pos[i*3+1] = HOME_ORIGIN.y + 1.6;
    pos[i*3+2] = HOME_ORIGIN.z + 3.2 + (Math.random()-0.5)*0.3;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var mat = new THREE.PointsMaterial({color:0xd8d8e8, size:0.15, transparent:true, opacity:0.7, depthWrite:false});
  var p = new THREE.Points(geo, mat);
  scene.add(p);
  var life = 1.5;
  var vel = [];
  for(var j=0; j<N; j++) vel.push({x:(Math.random()-0.5)*0.3, y:0.5+Math.random()*0.4, z:(Math.random()-0.5)*0.3});
  var anim = function(){
    life -= 0.03;
    if(life <= 0){
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      return;
    }
    var a = p.geometry.attributes.position.array;
    for(var k=0; k<N; k++){
      a[k*3] += vel[k].x*0.03;
      a[k*3+1] += vel[k].y*0.03;
      a[k*3+2] += vel[k].z*0.03;
    }
    p.geometry.attributes.position.needsUpdate = true;
    p.material.opacity = life / 1.5 * 0.7;
    requestAnimationFrame(anim);
  };
  anim();
}

var joyEl = document.getElementById('joy');
var joyKnob = document.getElementById('joyKnob');
var lookZone = document.getElementById('lookZone');
var joy = {active:false, id:null, cx:0, cy:0, dx:0, dy:0};
var runHeld = false;

function joyStart(e){
  var t = e.changedTouches ? e.changedTouches[0] : e;
  if(joy.id !== null) return;
  joy.id = (t.identifier !== undefined) ? t.identifier : 'mouse';
  joy.active = true;
  var r = joyEl.getBoundingClientRect();
  joy.cx = r.left + r.width/2;
  joy.cy = r.top + r.height/2;
  joyMove(e);
  e.preventDefault();
}
function joyMove(e){
  if(!joy.active) return;
  var touches = e.changedTouches || [e];
  for(var i=0; i<touches.length; i++){
    var t = touches[i];
    var tid = (t.identifier !== undefined) ? t.identifier : 'mouse';
    if(tid !== joy.id) continue;
    var dx = t.clientX - joy.cx;
    var dy = t.clientY - joy.cy;
    var maxR = 45;
    var d = Math.hypot(dx, dy);
    var cl = Math.min(1, d/maxR);
    var ang = Math.atan2(dy, dx);
    var kx = Math.cos(ang)*cl*maxR;
    var ky = Math.sin(ang)*cl*maxR;
    joyKnob.style.transform = 'translate(calc(-50% + ' + kx + 'px), calc(-50% + ' + ky + 'px))';
    joy.dx = Math.cos(ang)*cl;
    joy.dy = Math.sin(ang)*cl;
  }
  e.preventDefault();
}
function joyEnd(e){
  if(!joy.active) return;
  var touches = e.changedTouches || [e];
  for(var i=0; i<touches.length; i++){
    var t = touches[i];
    var tid = (t.identifier !== undefined) ? t.identifier : 'mouse';
    if(tid === joy.id){
      joy.active = false;
      joy.id = null;
      joy.dx = 0;
      joy.dy = 0;
      joyKnob.style.transform = 'translate(-50%,-50%)';
    }
  }
}
joyEl.addEventListener('touchstart', joyStart, {passive:false});
joyEl.addEventListener('touchmove', joyMove, {passive:false});
joyEl.addEventListener('touchend', joyEnd);
joyEl.addEventListener('touchcancel', joyEnd);
joyEl.addEventListener('mousedown', joyStart);
window.addEventListener('mousemove', joyMove);
window.addEventListener('mouseup', joyEnd);

// چرخش دوربین
var look = {active:false, id:null, lastX:0, lastY:0};
function lookStart(e){
  var t = e.changedTouches ? e.changedTouches[0] : e;
  if(look.id !== null) return;
  look.id = (t.identifier !== undefined) ? t.identifier : 'mouse';
  look.active = true;
  look.lastX = t.clientX;
  look.lastY = t.clientY;
  e.preventDefault();
}
function lookMove(e){
  if(!look.active) return;
  var touches = e.changedTouches || [e];
  for(var i=0; i<touches.length; i++){
    var t = touches[i];
    var tid = (t.identifier !== undefined) ? t.identifier : 'mouse';
    if(tid !== look.id) continue;
    var dx = t.clientX - look.lastX;
    var dy = t.clientY - look.lastY;
    player.rot -= dx * 0.008;
    player.pitch = Math.max(-0.5, Math.min(1.0, player.pitch + dy * 0.006));
    look.lastX = t.clientX;
    look.lastY = t.clientY;
  }
  e.preventDefault();
}
function lookEnd(e){
  if(!look.active) return;
  var touches = e.changedTouches || [e];
  for(var i=0; i<touches.length; i++){
    var t = touches[i];
    var tid = (t.identifier !== undefined) ? t.identifier : 'mouse';
    if(tid === look.id){
      look.active = false;
      look.id = null;
    }
  }
}
lookZone.addEventListener('touchstart', lookStart, {passive:false});
lookZone.addEventListener('touchmove', lookMove, {passive:false});
lookZone.addEventListener('touchend', lookEnd);
lookZone.addEventListener('touchcancel', lookEnd);
lookZone.addEventListener('mousedown', lookStart);
window.addEventListener('mousemove', lookMove);
window.addEventListener('mouseup', lookEnd);

var btnInteract = document.getElementById('btnInteract');
var btnRun = document.getElementById('btnRun');
btnInteract.addEventListener('touchstart', function(e){ e.preventDefault(); tryInteract(); }, {passive:false});
btnInteract.addEventListener('click', function(){ if(!IS_TOUCH) tryInteract(); });

function runOn(e){ if(e) e.preventDefault(); runHeld = true; btnRun.classList.add('active'); }
function runOff(e){ if(e) e.preventDefault(); runHeld = false; btnRun.classList.remove('active'); }
btnRun.addEventListener('touchstart', runOn, {passive:false});
btnRun.addEventListener('touchend', runOff);
btnRun.addEventListener('touchcancel', runOff);
btnRun.addEventListener('mousedown', runOn);
btnRun.addEventListener('mouseup', runOff);
btnRun.addEventListener('mouseleave', runOff);

var keys = {};
window.addEventListener('keydown', function(e){
  keys[e.key.toLowerCase()] = true;
  if(e.key === 'Escape' && state.dialogueOpen) closeDialog();
  if(e.key.toLowerCase() === 'e' && !state.dialogueOpen) tryInteract();
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

var currentInteract = null;
function tryInteract(){
  if(state.dialogueOpen || state.paused || mg.active) return;
  if(currentInteract) currentInteract.fn();
}

// گرد و خاک
var dustZones = [{x:-45, z:-35, r:14}];
var dustEl = document.getElementById('dust');
function updateDust(dt){
  var inDust = false;
  for(var i=0; i<dustZones.length; i++){
    var z = dustZones[i];
    var dx = player.pos.x - z.x;
    var dz = player.pos.z - z.z;
    if(dx*dx + dz*dz < z.r*z.r){ inDust = true; break; }
  }
  if(inDust) player.dustT = Math.min(1, player.dustT + dt*2);
  else player.dustT = Math.max(0, player.dustT - dt*1.5);
  player.covering = player.dustT > 0.35;
  if(player.dustT > 0.35) dustEl.classList.add('show');
  else dustEl.classList.remove('show');
}

// ==========================================================================
// حلقه بازی
// ==========================================================================
var clock = new THREE.Clock();
var camTarget = new THREE.Vector3();
var cameraBob = 0;

function updatePlayer(dt){
  if(state.dialogueOpen || mg.active) return;
  var running = runHeld || keys['shift'];
  var speed = player.speed * (running ? 1.85 : 1);

  if(keys['a'] || keys['arrowleft']) player.rot += 2.4*dt;
  if(keys['d'] || keys['arrowright']) player.rot -= 2.4*dt;
  if(keys['arrowup']) player.pitch = Math.max(-0.5, player.pitch - 0.6*dt);
  if(keys['arrowdown']) player.pitch = Math.min(1.0, player.pitch + 0.6*dt);

  var mx = 0, my = 0;
  if(joy.active){ mx = joy.dx; my = -joy.dy; }
  if(keys['w']) my = 1;
  if(keys['s']) my = -1;

  var moved = false;
  if(Math.abs(mx) > 0.05 || Math.abs(my) > 0.05){
    var f = new THREE.Vector3(-Math.sin(player.rot), 0, -Math.cos(player.rot));
    var r = new THREE.Vector3(Math.cos(player.rot), 0, -Math.sin(player.rot));
    var v = new THREE.Vector3().addScaledVector(f, my).addScaledVector(r, mx);
    if(v.length() > 0.05){
      v.normalize();
      player.pos.addScaledVector(v, speed*dt);
      moved = true;
      if(state.insideHome){
        var lx = player.pos.x - HOME_ORIGIN.x;
        var lz = player.pos.z - HOME_ORIGIN.z;
        player.pos.x = HOME_ORIGIN.x + Math.max(-5.5, Math.min(5.5, lx));
        player.pos.z = HOME_ORIGIN.z + Math.max(-5.5, Math.min(5.5, lz));
      } else {
        player.pos.x = Math.max(-95, Math.min(95, player.pos.x));
        player.pos.z = Math.max(-95, Math.min(95, player.pos.z));
      }
    }
  }
  player.running = running && moved;

  if(player.running && state.hasBasket && state.basketFruit > 0){
    player._dropAcc = (player._dropAcc || 0) + dt;
    if(player._dropAcc > 1.2){
      player._dropAcc = 0;
      state.basketFruit = Math.max(0, state.basketFruit - 1);
      showToast('🍎 انار افتاد!');
      updateHUD();
    }
  }

  if(moved && !state.sitting){
    player.walkPhase += dt * (player.running ? 14 : 9);
    var sw = Math.sin(player.walkPhase) * (player.running ? 0.85 : 0.5);
    player.legs.l.rotation.x = sw;
    player.legs.r.rotation.x = -sw;
    if(!player.covering){
      player.arms.l.rotation.x = -sw*0.6;
      player.arms.r.rotation.x = sw*0.6;
    }
    cameraBob += dt * (player.running ? 14 : 9);
  } else {
    player.walkPhase *= 0.85;
    player.legs.l.rotation.x *= 0.85;
    player.legs.r.rotation.x *= 0.85;
    if(!player.covering){
      player.arms.l.rotation.x *= 0.85;
      player.arms.r.rotation.x *= 0.85;
    }
  }

  var targetT = player.covering ? 1 : 0;
  player.coverT += (targetT - player.coverT) * Math.min(1, dt*6);
  var cT = player.coverT;
  if(cT > 0.05){
    player.arms.r.rotation.x = -cT*2.6;
    player.arms.r.rotation.z = cT*0.6;
    player.arms.l.rotation.x = -cT*2.2;
    player.arms.l.rotation.z = -cT*0.5;
    player.head.rotation.x = cT*0.35;
  } else {
    player.arms.r.rotation.z = 0;
    player.arms.l.rotation.z = 0;
    player.head.rotation.x = 0;
  }

  if(state.sitting){
    player.group.position.set(HOME_ORIGIN.x - 3.5, HOME_ORIGIN.y + 0.25, HOME_ORIGIN.z + 2.2);
    player.group.rotation.y = Math.PI;
    player.legs.l.rotation.x = -1.2;
    player.legs.r.rotation.x = -1.2;
  } else {
    player.group.position.copy(player.pos);
    player.group.rotation.y = player.rot;
  }
}

function updateCamera(dt){
  var back = new THREE.Vector3(Math.sin(player.rot), 0, Math.cos(player.rot));
  var dist = Math.max(4.5, Math.min(6.8, window.innerWidth/160));
  var bob = Math.sin(cameraBob) * (player.running ? 0.06 : 0.03);
  var baseY = state.sitting ? 2.4 : dist*0.55 + 1.3;
  var anchor = state.sitting ? player.group.position : player.pos;
  var desired = anchor.clone()
    .addScaledVector(back, state.sitting ? 3.5 : dist)
    .add(new THREE.Vector3(0, baseY + bob, 0));
  camera.position.lerp(desired, Math.min(1, dt*4));
  var lookY = state.sitting ? 1.6 : 1.5 + player.pitch * 2.5;
  camTarget.copy(anchor).add(new THREE.Vector3(0, lookY, 0));
  camera.lookAt(camTarget);
}

function updateInteractPrompt(){
  if(state.dialogueOpen || mg.active){
    promptEl.classList.remove('show');
    return;
  }
  var best = null, bestD = Infinity;
  for(var i=0; i<interactables.length; i++){
    var it = interactables[i];
    if(state.insideHome !== it.inHome) continue;
    var d = Math.hypot(player.pos.x - it.x, player.pos.z - it.z);
    if(d < it.r && d < bestD){ best = it; bestD = d; }
  }
  currentInteract = best;
  if(best){
    promptEl.textContent = '👉 ' + best.label;
    promptEl.classList.add('show');
  } else {
    promptEl.classList.remove('show');
  }
}

function updateSheep(dt){
  if(!state.sheepFollowing) return;
  sheep.forEach(function(s, i){
    var target = player.pos.clone().add(new THREE.Vector3(Math.cos(i*1.1)*3.2, 0, Math.sin(i*1.1)*3.2));
    var dir = target.clone().sub(s.group.position);
    var d = dir.length();
    if(d > 0.5){
      dir.normalize();
      s.group.position.addScaledVector(dir, Math.min(d, 3.0*dt));
      s.group.rotation.y = Math.atan2(dir.x, dir.z) + Math.PI;
    }
  });
  var dxp = player.pos.x - 70, dzp = player.pos.z + 45;
  if(!state.sheepInPasture && dxp*dxp + dzp*dzp < 24*24){
    state.sheepInPasture = true;
    showToast('🐑 رسید چراگاه!');
  }
  if(state.sheepInPasture && state.hour >= 19 && !state.waitingForNight){
    state.waitingForNight = true;
    showToast('🌙 غروب — برگردون!');
  }
  var dxb = player.pos.x - 60, dzb = player.pos.z + 10;
  if(state.waitingForNight && dxb*dxb + dzb*dzb < 6*6){
    state.sheepFollowing = false;
    state.sheepInPasture = false;
    state.waitingForNight = false;
    state.money += 700;
    if(state.job && state.job.type === 'sheep') state.job = null;
    showToast('✅ گله برگشت — +۷۰۰');
    updateHUD();
  }
}

function updateFishSystem(dt){
  if(!state.job || state.job.type !== 'fish'){
    fishingBite = false;
    return;
  }
  if(fishingBite) return;
  fishingTimer += dt;
  if(fishingTimer >= 2 + Math.random()*2){
    fishingBite = true;
    showToast('🐟 ماهی! برو کشیدن ماهی بزن');
  }
}

function updateMiniGameCursor(dt){
  if(!mg.active) return;
  mg.timer += dt;
  mg.cursor = (Math.sin(mg.timer * mg.speed * 2) + 1) / 2;
  document.getElementById('mgCursor').style.left = (mg.cursor*100) + '%';
}

function updateLighting(){
  var h = state.hour + state.minute/60;
  var sunI = 0;
  if(h >= 6 && h < 8){ sunI = (h-6)/2 * 1.35; }
  else if(h >= 8 && h < 17){ sunI = 1.35; }
  else if(h >= 17 && h < 20){ sunI = 1.35 * (1 - (h-17)/3); }
  else { sunI = 0.06; }

  sun.intensity = sunI;
  ambNight.intensity = 0.4 * (1 - Math.min(1, sunI/1.35));
  hemi.intensity = 0.15 + 0.5 * Math.min(1, sunI/1.35);

  var dayTop = new THREE.Color(0x3a7ab8), dayBot = new THREE.Color(0xcfd8e0);
  var sunsetTop = new THREE.Color(0x4a3a6a), sunsetBot = new THREE.Color(0xff9966);
  var nightTop = new THREE.Color(0x0a0e1e), nightBot = new THREE.Color(0x1a2040);
  var top, bot;

  if(h >= 5 && h < 7){
    var t1 = (h-5)/2;
    top = nightTop.clone().lerp(sunsetTop, t1);
    bot = nightBot.clone().lerp(sunsetBot, t1);
  } else if(h >= 7 && h < 17){
    var t2 = Math.min(1, (h-7)/3);
    top = sunsetTop.clone().lerp(dayTop, t2);
    bot = sunsetBot.clone().lerp(dayBot, t2);
  } else if(h >= 17 && h < 19){
    var t3 = (h-17)/2;
    top = dayTop.clone().lerp(sunsetTop, t3);
    bot = dayBot.clone().lerp(sunsetBot, t3);
  } else if(h >= 19 && h < 21){
    var t4 = (h-19)/2;
    top = sunsetTop.clone().lerp(nightTop, t4);
    bot = sunsetBot.clone().lerp(nightBot, t4);
  } else {
    top = nightTop;
    bot = nightBot;
  }

  skyMat.uniforms.topColor.value.copy(top);
  skyMat.uniforms.bottomColor.value.copy(bot);

  var ang = ((h - 6) / 24) * Math.PI * 2;
  sun.position.set(Math.cos(ang)*80, Math.max(10, Math.sin(ang)*90), 40);

  var R = 300;
  sunDisc.position.set(Math.cos(ang)*R*0.5, Math.sin(ang)*R*0.4, 200);
  sunDisc.lookAt(0, 20, 0);
  sunDisc.material.opacity = Math.max(0, Math.min(0.9, sunI/1.35));

  scene.fog.color.copy(bot);
  scene.fog.density = (h >= 6 && h < 19) ? 0.0075 : 0.012;

  var isNight = (h >= 19 || h < 6);
  if(homeGroup.userData.light) homeGroup.userData.light.intensity = isNight ? 1.2 : 0.2;
}

var lastHudUpdate = 0;

function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(0.05, clock.getDelta());

  if(state.started && !state.paused){
    timeAccum += dt;
    while(timeAccum >= SEC_PER_GAME_MIN){
      timeAccum -= SEC_PER_GAME_MIN;
      advanceTime(1);
    }
    updatePlayer(dt);
    updateSheep(dt);
    updateDust(dt);
    updateFishSystem(dt);
    updateMiniGameCursor(dt);
    updateCamera(dt);
    updateInteractPrompt();
    updateLighting();
    sky.position.copy(camera.position);

    lastHudUpdate += dt;
    if(lastHudUpdate > 0.2){
      lastHudUpdate = 0;
      updateHUD();
    }
  }
  renderer.render(scene, camera);
}
animate();
